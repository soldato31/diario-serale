<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diario Serale">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Diario Serale</title>
<style>
:root{--bg:#0e1012;--card:#181b1f;--card2:#1f2328;--line:#2a2f36;--tx:#ece9e2;--mu:#8d939a;--ac:#e0a458;--ac2:#f3c887;--ok:#7cc496;--bad:#e2725b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button:disabled{opacity:.4}
header{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;background:linear-gradient(var(--bg) 75%,rgba(14,16,18,0));max-width:720px;margin:0 auto}
.hl{display:flex;align-items:flex-end;gap:8px;min-width:0}
.back{background:var(--card);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;font-size:20px;line-height:1;flex:none;cursor:pointer}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{margin:2px 0 0;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
main{padding:0 16px calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;min-width:0}
.card.is-today{border-color:rgba(224,164,88,.55)}
.card.center{text-align:center}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.card-h h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-weight:700}
.card-h h3.dayname{color:var(--tx);font-size:14px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.muted{color:var(--mu);font-size:13px}
.hint{color:var(--mu);font-size:12.5px;margin:8px 0 0}
.warn{background:rgba(226,114,91,.12);color:#f0a08c;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:0 0 10px}
.ok{color:var(--ok)}
.sub-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:10px}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;color:var(--tx)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#1a1307}
.btn.danger{color:var(--bad)}
.btn.ghost{opacity:.5}
.btn.wide{width:100%}
.pill{font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(224,164,88,.15);color:var(--ac);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.bad{color:var(--bad)}
.chev{color:var(--mu);font-size:18px;margin-left:auto;flex:none}
/* turni */
.shiftbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:14px}
.shiftmini{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);margin:-4px 0 8px;cursor:pointer}
/* lezioni */
.lessons{display:flex;flex-direction:column;gap:6px}
.lesson{display:flex;align-items:stretch;gap:10px;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:9px 10px;text-align:left;width:100%;cursor:pointer}
.lesson.now{border-color:var(--ac);box-shadow:0 0 0 3px rgba(224,164,88,.12)}
.lesson.empty .lb b{color:var(--mu);font-weight:500}
.lesson.credit{opacity:.55}
.lt{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;width:42px;flex:none;line-height:1.25}
.lt small{color:var(--mu);font-weight:500}
.lbar{width:4px;border-radius:4px;flex:none}
.lb{display:flex;flex-direction:column;min-width:0;flex:1}
.lb small{color:var(--mu);font-size:12.5px}
.lb em{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-left:6px;padding:1px 6px;border-radius:6px;vertical-align:2px}
.live{background:var(--ac);color:#1a1307}
.sup{background:rgba(111,168,220,.2);color:#9cc4ea}
.topic{font-size:12.5px;color:var(--ac2);margin-top:2px}
/* tips */
.tip{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.tip:first-of-type{border-top:0;padding-top:0}
.tip.act{cursor:pointer}
.ti{flex:none;width:22px;text-align:center}
/* quick grid */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qb{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.qb b{font-size:20px;color:var(--ac)}
.qb small{font-size:11px;color:var(--mu);line-height:1.2}
/* checks & chips */
.checks{display:flex;flex-direction:column;gap:4px}
.chk{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 2px;text-align:left;cursor:pointer;width:100%}
.chk i{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.chk.on i{background:var(--ok);border-color:var(--ok)}
.chk.on i::after{content:"✓";color:#0e1012;font-style:normal;font-size:13px;font-weight:800}
.chk span{flex:1}
.checks .chk.on span{color:var(--mu);text-decoration:line-through}
.chk small{color:var(--mu);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px;color:var(--tx);text-decoration:none}
.chip.ok{opacity:.45;text-decoration:line-through}
.chip.warn{border-color:rgba(226,114,91,.5);color:var(--bad)}
.chip.act{cursor:pointer}
.chip.sel{background:var(--ac);color:#1a1307;border-color:var(--ac)}
.stchip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mu);white-space:nowrap}
.stchip.p{background:rgba(124,196,150,.15);color:var(--ok)}
.stchip.a{background:rgba(226,114,91,.15);color:var(--bad)}
.stchip.w{background:rgba(224,164,88,.15);color:var(--ac)}
.stchip.f{background:rgba(111,168,220,.15);color:#9cc4ea}
/* tasks */
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .grow{cursor:pointer}
.task b{font-weight:600;display:block}
.task small{color:var(--mu);font-size:12.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.task.done b{text-decoration:line-through;color:var(--mu)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;margin-top:1px;cursor:pointer}
.ck.on{background:var(--ok);border-color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* lists */
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);color:var(--tx);text-decoration:none}
.li:first-child{border-top:0}
.li small{display:block;color:var(--mu);font-size:12.5px}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ac);flex:none;overflow:hidden}
.avimg{width:100%;height:100%;object-fit:cover}
.ib{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;font-size:15px;flex:none;cursor:pointer;color:var(--tx)}
.ib.sm{width:30px;height:30px;font-size:14px;border-radius:8px}
/* seg */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx)}
.weeknav{display:flex;gap:6px;justify-content:space-between;margin-bottom:12px}
/* matrix */
.matrix{display:grid;grid-template-columns:40px repeat(5,1fr);gap:4px;font-size:11px}
.mh{text-align:center;color:var(--mu);font-weight:600}
.mt-t{color:var(--mu);font-variant-numeric:tabular-nums;align-self:center}
.mc{min-height:30px;border:1px dashed var(--line);border-radius:7px;display:grid;place-items:center;font-weight:700;letter-spacing:.04em;cursor:pointer}
/* stats */
.stat{display:flex;align-items:center;gap:14px}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--mu)}
.bar{position:relative;height:8px;background:var(--card2);border-radius:8px;margin:12px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx);opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.kpis b{display:block;font-size:17px}
.kpis small{color:var(--mu);font-size:11px;line-height:1.2;display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--tx);text-decoration:none}
.tile span{font-size:22px}
.tile .tic{font-size:22px;font-weight:800;color:var(--ac)}
.tile b{font-size:15px}
.tile small{color:var(--mu);font-size:12px}
/* forms */
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;letter-spacing:.03em}
.f input,.f select,.f textarea,.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--ac)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inrow{display:flex;gap:6px;align-items:center}
.inrow.top{align-items:flex-start}
.inrow>input,.inrow>textarea{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;width:100%}
.mic{width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--line);flex:none;cursor:pointer;font-size:17px}
.mic.rec{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--tx)}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* foto */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;background:var(--card2)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer}
.bigimg{width:100%;border-radius:12px;display:block}
/* AI */
.aiout{margin-top:10px;font-size:14.5px;overflow-wrap:anywhere}
.aiout:empty{display:none}
.aiout h4{margin:12px 0 4px;color:var(--ac2);font-size:14px}
.aiout p{margin:6px 0}
.aiout ul,.aiout ol{margin:6px 0;padding-left:20px}
.aiout code,.frow code,.msg code{background:var(--card2);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.aiout pre,.msg pre{background:var(--card2);padding:10px;border-radius:10px;overflow-x:auto;font-size:12.5px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes rot{to{transform:rotate(360deg)}}
/* formule e link */
.flist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.frow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow code{white-space:normal;overflow-wrap:anywhere}
.wk{display:flex;gap:12px;align-items:flex-start}
.wk img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:#fff}
.wk p{margin:4px 0 6px;font-size:14px}
.linkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lk{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;text-decoration:none;color:var(--tx);font-size:13.5px;font-weight:600}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.libt{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.libt b{font-size:13.5px;line-height:1.25}
.libt small{color:var(--mu);font-size:11.5px}
.det{border-top:1px solid var(--line);padding:4px 0}
.det:first-of-type{border-top:0}
.det summary{cursor:pointer;padding:8px 0;list-style:none;display:flex;justify-content:space-between}
.det summary::after{content:"＋";color:var(--mu)}
.det[open] summary::after{content:"−"}
.det p{margin:0 0 6px;font-size:14px}
.plain{margin:0;padding-left:18px}
.plain li{margin:4px 0}
/* flashcard e quiz */
.fc{min-height:200px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center}
.fcf{font-size:19px;font-weight:600;white-space:pre-wrap}
.fcb{font-size:16px;white-space:pre-wrap;color:var(--ac2)}
.fc hr{border:0;border-top:1px solid var(--line);margin:16px 0;width:100%}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate .btn{padding:10px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center}
.rate small{font-weight:500;font-size:11px;opacity:.75}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:15px}
.opt.ok{border-color:var(--ok);background:rgba(124,196,150,.12)}
.opt.ko{border-color:var(--bad);background:rgba(226,114,91,.12)}
.opt:disabled{opacity:1}
.pv{padding:8px 2px;border-top:1px solid var(--line)}
.pv span small{color:var(--mu)}
/* timer */
.clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#pomoPill{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;background:var(--ac);color:#1a1307;border:0;border-radius:99px;padding:8px 14px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bval{width:100%;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:2px}
.bcol small{color:var(--mu);font-size:11px}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14.5px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ac);color:#1a1307;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.ai p{margin:4px 0}.msg.ai ul,.msg.ai ol{margin:4px 0;padding-left:18px}.msg.ai h4{margin:8px 0 2px;color:var(--ac2)}
.composer{display:flex;gap:6px;align-items:flex-end;margin-top:12px;position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--bg);padding:6px 0}
.composer textarea{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;resize:none;outline:none}
/* strumenti */
.result{background:var(--card2);border-radius:12px;padding:12px;font-size:16px;margin-top:6px;overflow-wrap:anywhere}
.result b{color:var(--ac2);font-size:19px}
.eq{background:var(--card2);border-radius:10px;padding:10px;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;margin:8px 0;font-size:15px}
.ptwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.pt{display:grid;grid-template-columns:repeat(18,34px);grid-template-rows:repeat(7,38px) 12px repeat(2,38px);gap:2px;width:max-content}
.el{border:0;border-radius:5px;background:color-mix(in srgb,var(--c) 28%,var(--card2));color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1}
.el small{font-size:8px;color:var(--mu)}
.el b{font-size:13px}
.el.ph{background:none;border:1px dashed var(--line);font-size:8px;color:var(--mu);cursor:default}
.elbig{width:120px;height:120px;margin:0 auto 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 30%,var(--card2));display:flex;flex-direction:column;align-items:center;justify-content:center}
.elbig b{font-size:40px}.elbig small,.elbig span{color:var(--mu)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.resistor{display:flex;justify-content:center;padding:14px 0;background:linear-gradient(transparent 47%,#9aa 47%,#9aa 53%,transparent 53%)}
.rbody{width:180px;height:44px;border-radius:18px;background:#d9c49a;display:flex;justify-content:space-evenly;padding:0 22px}
.rbody i{width:12px;height:100%}
.tblcard{padding:6px}
.tblwrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{text-align:left;color:var(--ac);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
/* voti */
.grades{display:flex;gap:6px;flex-wrap:wrap}
.gr{background:var(--card2);border:2px solid;border-radius:10px;padding:6px 8px;min-width:54px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.gr b{font-size:17px}.gr small{font-size:10px;color:var(--mu)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sheet-head h2{margin:0;font-size:18px;overflow-wrap:anywhere}
.sheet-head button{background:var(--card2);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.sheet-foot .left{margin-right:auto}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(20,22,25,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav .in{display:flex;width:100%;max-width:720px}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;min-width:0}
nav button.on{color:var(--ac)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-s{color:var(--mu);font-size:13.5px;padding:6px 0;margin:0}
a{color:var(--ac)}
#print{display:none}
@media (max-width:380px){.qgrid{grid-template-columns:repeat(2,1fr)}.rate{grid-template-columns:repeat(2,1fr)}}
@media print{body.printing>*:not(#print){display:none!important}body.printing #print{display:block;color:#000;background:#fff;font:12px/1.4 Arial,sans-serif;padding:10px}
#print h1{font-size:20px;color:#000}#print table{border-collapse:collapse;width:100%}#print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left}html,body{background:#fff}}

<script>
'use strict';
/* ============ LIBRERIA DI STUDIO PER MATERIA ============ */
const LIB={
matematica:{name:'Matematica',m:['matem'],intro:'Nel primo periodo si ripartono le basi: calcolo, algebra, equazioni, geometria. È il linguaggio di fisica, elettrotecnica e meccanica: ogni ora qui ne fa risparmiare tre altrove.',
topics:[
{t:'Insiemi numerici e potenze',k:['potenz','numeri','insiem','frazion','radic'],d:'N ⊂ Z ⊂ Q ⊂ R. Le regole delle potenze servono ovunque, soprattutto con la notazione scientifica.',f:['aⁿ·aᵐ = aⁿ⁺ᵐ','aⁿ : aᵐ = aⁿ⁻ᵐ','(aⁿ)ᵐ = aⁿ·ᵐ','a⁰ = 1   a⁻ⁿ = 1/aⁿ','a^(m/n) = ⁿ√(aᵐ)','Notazione scientifica: 0,00047 = 4,7·10⁻⁴']},
{t:'Percentuali e proporzioni',k:['percent','proporz','sconto'],d:'La proporzione a:b = c:d si risolve col prodotto in croce. Una percentuale è una frazione con denominatore 100.',f:['a:b = c:d  →  a·d = b·c','x% di N = N·x/100','Variazione % = (nuovo − vecchio)/vecchio · 100']},
{t:'Monomi e polinomi',k:['monom','polinom','algebr','calcolo letterale'],d:'Si sommano solo i monomi simili. Nel prodotto tra polinomi ogni termine moltiplica tutti gli altri.',f:['(a+b)² = a² + 2ab + b²','(a−b)² = a² − 2ab + b²','(a+b)(a−b) = a² − b²','(a+b)³ = a³ + 3a²b + 3ab² + b³']},
{t:'Scomposizione in fattori',k:['scompos','fattor','raccogliment'],d:'Ordine di attacco: raccoglimento totale, raccoglimento parziale, prodotti notevoli, trinomio speciale, Ruffini.',f:['x² + sx + p = (x+a)(x+b) con a+b=s, a·b=p','a² − b² = (a+b)(a−b)']},
{t:'Equazioni di primo grado',k:['equazion','primo grado','lineari'],d:'Principi di equivalenza: puoi sommare o moltiplicare entrambi i membri per la stessa quantità (≠ 0). Verifica sempre sostituendo.',f:['ax + b = 0  →  x = −b/a']},
{t:'Equazioni di secondo grado',k:['secondo grado','delta','discriminante','quadratic'],d:'Il discriminante Δ dice quante soluzioni reali ci sono: Δ>0 due, Δ=0 una doppia, Δ<0 nessuna.',f:['ax² + bx + c = 0','Δ = b² − 4ac','x = (−b ± √Δ) / 2a','x₁+x₂ = −b/a    x₁·x₂ = c/a']},
{t:'Disequazioni e sistemi',k:['disequaz','sistem','sostituzion','cramer'],d:'Moltiplicando per un numero negativo il verso della disequazione si inverte. Sistemi 2×2: sostituzione, riduzione, Cramer.',f:['Cramer: x = Dx/D   y = Dy/D','D = a₁b₂ − a₂b₁']},
{t:'Piano cartesiano e retta',k:['cartesian','retta','coefficiente angolare','pendenza','funzion'],d:'La retta y = mx + q: m è la pendenza, q l\'intercetta sull\'asse y. Rette parallele hanno stesso m, perpendicolari m₁·m₂ = −1.',f:['y = mx + q','m = (y₂−y₁)/(x₂−x₁)','Distanza: d = √((x₂−x₁)² + (y₂−y₁)²)','Punto medio: ((x₁+x₂)/2 ; (y₁+y₂)/2)']},
{t:'Geometria piana',k:['geometri','aree','perimetr','pitagor','triangol','cerchio'],d:'Pitagora vale solo nei triangoli rettangoli. In officina: aree per sezioni resistenti, circonferenze per velocità di taglio.',f:['Pitagora: c² = a² + b²','Cerchio: A = πr²   C = 2πr','Triangolo: A = b·h/2','Trapezio: A = (B+b)·h/2','Somma angoli interni poligono: (n−2)·180°']},
{t:'Geometria solida',k:['solid','volum','cilindr','sfera','prism'],d:'Volume = area di base × altezza per prismi e cilindri; un terzo per piramidi e coni.',f:['Cilindro: V = πr²h','Cono: V = πr²h/3','Sfera: V = 4/3·πr³   S = 4πr²','Prisma: V = Ab·h']},
{t:'Trigonometria di base',k:['trigonom','seno','coseno','tangente','angol'],d:'Nel triangolo rettangolo: cateto = ipotenusa × seno dell\'angolo opposto (o coseno dell\'adiacente). Indispensabile per scomporre forze e vettori.',f:['sin α = opposto/ipotenusa','cos α = adiacente/ipotenusa','tan α = opposto/adiacente','sin²α + cos²α = 1','rad = gradi · π/180']}
],
errors:['Dimenticare di cambiare segno portando un termine oltre l\'uguale.','(a+b)² ≠ a² + b²: manca il doppio prodotto.','Dividere per una quantità che può essere zero.','Disequazioni: non invertire il verso quando moltiplichi per un negativo.'],
links:[{n:'YouMath',u:'https://www.youmath.it',d:'Teoria ed esercizi svolti, in italiano'},{n:'Khan Academy (italiano)',u:'https://it.khanacademy.org/math',d:'Videolezioni ed esercizi graduati'},{n:'GeoGebra',u:'https://www.geogebra.org/calculator',d:'Grafici, geometria, calcolo'},{n:'Desmos',u:'https://www.desmos.com/calculator?lang=it',d:'Calcolatrice grafica'},{n:'WolframAlpha',u:'https://www.wolframalpha.com',d:'Risolve e mostra i passaggi'},{n:'Matematicamente',u:'https://www.matematicamente.it',d:'Forum ed esercizi'}],
tools:['conv','solver']},

fisica:{name:'Fisica',m:['fisic'],intro:'Grandezze, misure, forze, moto, energia. La fisica del primo periodo è la base di meccanica applicata ed elettrotecnica: ragiona sempre con le unità di misura.',
topics:[
{t:'Grandezze e unità di misura',k:['grandezz','unità','misur','sistema internazionale','SI','conversion','notazione'],d:'Sette grandezze fondamentali nel SI (m, kg, s, A, K, mol, cd). Tutte le altre sono derivate. Converti sempre prima di calcolare.',f:['1 km/h = 1/3,6 m/s','1 N = 1 kg·m/s²','1 J = 1 N·m   1 W = 1 J/s','1 Pa = 1 N/m²   1 bar = 10⁵ Pa']},
{t:'Errori di misura',k:['error','incertezz','sensibilit','media','cifre significative'],d:'Ogni misura ha un\'incertezza. Errore assoluto = semidispersione; errore relativo = assoluto/valore medio.',f:['x = x̄ ± Δx','Δx = (xmax − xmin)/2','εr = Δx / x̄   (in % ×100)']},
{t:'Vettori',k:['vettor','scomposiz','componenti','risultante'],d:'Un vettore ha modulo, direzione e verso. Si sommano col metodo punta-coda o del parallelogramma; per i calcoli si scompongono in x e y.',f:['Vx = V·cos α   Vy = V·sin α','|V| = √(Vx² + Vy²)','α = arctan(Vy/Vx)']},
{t:'Forze ed equilibrio',k:['forz','equilibri','peso','attrito','elastic','hooke','molla'],d:'Un corpo è in equilibrio se la somma delle forze è zero e la somma dei momenti è zero. Peso ≠ massa.',f:['P = m·g   (g = 9,81 m/s²)','Hooke: F = k·Δx','Attrito: Fa = μ·N','Momento: M = F·b']},
{t:'Leve e momenti',k:['lev','moment','fulcro','coppia'],d:'Leva in equilibrio quando i momenti si bilanciano. Tre generi a seconda della posizione di fulcro, forza motrice e resistente.',f:['Fm·bm = Fr·br','Vantaggio = bm / br']},
{t:'Pressione e fluidi',k:['pression','fluid','stevino','pascal','archimede','idrostat'],d:'La pressione è forza su superficie. In un liquido cresce con la profondità (Stevino). Principio di Pascal: base di presse e circuiti idraulici.',f:['p = F/A','Stevino: p = p₀ + ρ·g·h','Archimede: Fa = ρ_fluido·g·V_immerso','Pascal: F₁/A₁ = F₂/A₂']},
{t:'Moto rettilineo uniforme',k:['moto rettilineo','uniforme','velocit','legge oraria'],d:'Velocità costante: spazi uguali in tempi uguali. Il grafico s-t è una retta con pendenza v.',f:['v = Δs/Δt','s = s₀ + v·t']},
{t:'Moto uniformemente accelerato',k:['accelera','caduta','uniformemente','mrua'],d:'Accelerazione costante: la velocità cresce linearmente. Caduta libera: a = g.',f:['a = Δv/Δt','v = v₀ + a·t','s = s₀ + v₀t + ½at²','v² = v₀² + 2a·Δs']},
{t:'Principi della dinamica',k:['dinamic','newton','inerzia','principi'],d:'1° inerzia; 2° F = m·a; 3° azione e reazione. La forza non serve a mantenere il moto, serve a cambiarlo.',f:['F = m·a','Quantità di moto: q = m·v','Impulso: I = F·Δt = Δq']},
{t:'Moto circolare',k:['circolar','centripet','periodo','frequenz','angolare'],d:'Moto circolare uniforme: velocità costante in modulo, ma cambia direzione. Serve per ruote, pulegge, mandrini.',f:['ω = 2π/T = 2πf','v = ω·r','ac = v²/r = ω²r','n [giri/min] = 60·f']},
{t:'Lavoro, energia, potenza',k:['lavoro','energi','potenz','cinetic','potenziale','conservazion','rendimento'],d:'Il lavoro è energia trasferita da una forza. In assenza di attriti l\'energia meccanica si conserva. Rendimento sempre < 1.',f:['L = F·s·cos α','Ec = ½·m·v²','Ep = m·g·h','P = L/t = F·v','η = Pu / Pa']},
{t:'Temperatura e calore',k:['temperatur','calore','termic','dilataz','specifico'],d:'Calore = energia in transito per differenza di temperatura. La dilatazione termica conta nei giochi di montaggio.',f:['Q = m·c·ΔT','K = °C + 273,15','Dilatazione lineare: ΔL = α·L₀·ΔT']}
],
errors:['Mescolare unità (km/h con m/s, grammi con kg).','Confondere massa (kg) e peso (N).','Dimenticare il segno o il verso dei vettori.','Usare g = 10 quando il prof vuole 9,81 (chiedi).'],
links:[{n:'PhET Simulazioni',u:'https://phet.colorado.edu/it/',d:'Simulazioni interattive gratuite (Colorado)'},{n:'Khan Academy Fisica',u:'https://it.khanacademy.org/science/physics',d:'Videolezioni'},{n:'YouMath',u:'https://www.youmath.it',d:'Teoria e problemi svolti'},{n:'Engineering ToolBox',u:'https://www.engineeringtoolbox.com',d:'Tabelle tecniche e dati'},{n:'WolframAlpha',u:'https://www.wolframalpha.com',d:'Calcoli con unità di misura'}],
tools:['conv','solver','const']},

chimica:{name:'Chimica',m:['chimic'],intro:'Materia, atomi, legami, reazioni. In meccanica torna su materiali, corrosione, trattamenti termici, lubrificanti e batterie.',
topics:[
{t:'Materia e stati di aggregazione',k:['materia','stati','miscugl','sostanz','passaggi di stato'],d:'Sostanze pure (elementi, composti) e miscugli (omogenei, eterogenei). Passaggi di stato: fusione, evaporazione, sublimazione e inversi.',f:['ρ = m/V']},
{t:'Atomo e struttura',k:['atomo','protoni','neutroni','elettroni','isotop','numero atomico','massa atomica'],d:'Z = numero di protoni (identifica l\'elemento). A = protoni + neutroni. Isotopi: stesso Z, diverso A.',f:['A = Z + N','Massa atomica relativa in u (1 u ≈ 1,66·10⁻²⁷ kg)']},
{t:'Tavola periodica',k:['tavola','periodic','gruppi','periodi','metalli','elettronegativ'],d:'Gruppi (colonne) = stesse proprietà chimiche. Periodi (righe) = stesso numero di gusci. Metalli a sinistra, non metalli a destra.',f:['Elettronegatività cresce → destra e ↑ in alto']},
{t:'Configurazione elettronica',k:['configurazion','orbital','livelli','aufbau'],d:'Gli elettroni riempiono gli orbitali in ordine di energia: 1s 2s 2p 3s 3p 4s 3d 4p… Gli elettroni di valenza decidono i legami.',f:['Max elettroni per livello: 2n²','s:2  p:6  d:10  f:14']},
{t:'Legami chimici',k:['legam','ionic','covalent','metallic','ottetto'],d:'Ionico (metallo + non metallo, trasferimento), covalente (condivisione), metallico (mare di elettroni: conducibilità e duttilità dei metalli).',f:['ΔEN > 1,9 → ionico','0,4 < ΔEN < 1,9 → covalente polare']},
{t:'Nomenclatura',k:['nomenclatur','ossidi','idrossid','acidi','sali','formule'],d:'Ossidi (basici e acidi), idrossidi, acidi (idracidi e ossiacidi), sali. Impara i numeri di ossidazione più comuni.',f:['Metallo + O₂ → ossido basico','Ossido basico + H₂O → idrossido','Ossido acido + H₂O → ossiacido','Acido + base → sale + acqua']},
{t:'Mole e stechiometria',k:['mole','stechiometr','avogadro','massa molare','bilanciament'],d:'La mole conta le particelle a pacchetti di 6,022·10²³. Prima bilanci la reazione, poi ragioni in moli.',f:['n = m / M','N = n · Nₐ   (Nₐ = 6,022·10²³)','Bilanciare: stessi atomi a sinistra e a destra']},
{t:'Soluzioni e concentrazione',k:['soluzion','concentraz','molarit','diluizion'],d:'Soluto + solvente. Molarità = moli per litro di soluzione. Diluizione: le moli restano uguali.',f:['M = n / V(L)','%m/m = m_soluto/m_soluzione · 100','C₁V₁ = C₂V₂']},
{t:'Gas',k:['gas','boyle','charles','gay-lussac','perfetti'],d:'Gas ideali: p, V, T e n legati dall\'equazione di stato. La temperatura va SEMPRE in kelvin.',f:['pV = nRT   (R = 8,314 J/mol·K)','Boyle: p₁V₁ = p₂V₂','V₁/T₁ = V₂/T₂','p₁/T₁ = p₂/T₂']},
{t:'Acidi, basi e pH',k:['acid','basi','ph','neutralizz'],d:'pH < 7 acido, = 7 neutro, > 7 basico. Scala logaritmica: un punto di pH = fattore 10.',f:['pH = −log[H⁺]','pH + pOH = 14']},
{t:'Ossidoriduzioni e corrosione',k:['ossidorid','redox','corrosion','ruggine','pila','elettrolis'],d:'Chi perde elettroni si ossida, chi li acquista si riduce. La corrosione dei metalli è una redox: zincatura e anodi sacrificali la contrastano.',f:['Fe → Fe²⁺ + 2e⁻ (ossidazione)','O₂ + 2H₂O + 4e⁻ → 4OH⁻ (riduzione)']}
],
errors:['Temperatura in °C nelle leggi dei gas: va in K.','Non bilanciare la reazione prima dei calcoli.','Confondere massa molare (g/mol) e massa (g).'],
links:[{n:'Chimica-online',u:'https://www.chimica-online.it',d:'Teoria ed esercizi in italiano'},{n:'Tavola periodica ptable',u:'https://ptable.com/?lang=it',d:'Tavola interattiva completa'},{n:'PhET Chimica',u:'https://phet.colorado.edu/it/',d:'Simulazioni su atomi e reazioni'},{n:'Khan Academy Chimica',u:'https://it.khanacademy.org/science/chemistry',d:'Videolezioni'},{n:'MolView',u:'https://molview.org',d:'Molecole in 3D'}],
tools:['ptable','molar','solver','const']},

disegno:{name:'Disegno tecnico',m:['disegn','grafic','ttrg','rappresentaz'],intro:'Il linguaggio universale dell\'officina. Precisione, pulizia, norme UNI/ISO. Nel serale si parte da strumenti, linee, costruzioni geometriche e proiezioni.',
topics:[
{t:'Strumenti e formati',k:['strument','formati','squadr','foglio','cartiglio','squadratura'],d:'Squadrette 45° e 30/60°, compasso, portamine (HB per il tratto fine, mina più morbida per il grosso). Formati UNI: A4 210×297, A3 297×420. Squadratura a 10 mm dal bordo (20 mm a sinistra per la rilegatura).',f:['A0 841×1189 · A1 594×841 · A2 420×594','A3 297×420 · A4 210×297 (mm)']},
{t:'Tipi di linea',k:['linee','tipi di linea','tratteggi','spessor'],d:'Continua grossa: spigoli in vista. Continua fine: quote, tratteggi, raccordi. Tratteggiata: spigoli nascosti. Mista fine a punto: assi e simmetrie. Mista con estremi grossi: tracce dei piani di sezione.',f:['Rapporto spessori grossa:fine ≈ 2:1 (es. 0,5 / 0,25 mm)']},
{t:'Scale di rappresentazione',k:['scal','riduzion','ingrandiment'],d:'Scala = misura sul disegno : misura reale. Le quote riportano SEMPRE la misura reale, qualunque sia la scala.',f:['Riduzione: 1:2 1:5 1:10 1:20 1:50 1:100','Ingrandimento: 2:1 5:1 10:1']},
{t:'Costruzioni geometriche',k:['costruz','perpendicol','bisettric','poligon','raccord','tangent','ovale'],d:'Perpendicolari, bisettrici, divisione di segmenti, poligoni inscritti, raccordi e tangenze: sono la base di ogni disegno di pezzo.',f:['Esagono inscritto: lato = raggio']},
{t:'Proiezioni ortogonali',k:['proiezion','ortogonal','viste','metodo europeo','triedro'],d:'Metodo europeo (E): il pezzo sta tra osservatore e piano. Vista frontale al centro, vista dall\'alto SOTTO, vista da sinistra A DESTRA. Le viste sono allineate: stessa larghezza tra frontale e pianta, stessa altezza tra frontale e laterale.',f:['Frontale ↔ pianta: stessa larghezza','Frontale ↔ laterale: stessa altezza','Pianta ↔ laterale: stessa profondità (linea a 45°)']},
{t:'Assonometrie',k:['assonometr','isometric','cavaliera','prospettiv'],d:'Isometrica: assi a 120°, nessuna riduzione (in pratica). Cavaliera: frontale in vera forma, profondità a 45° ridotta a metà.',f:['Isometrica: assi x,y a 30° dall\'orizzontale','Cavaliera: fuga a 45°, riduzione 1/2']},
{t:'Quotatura',k:['quot','quote','misure','frecce'],d:'Ogni misura una sola volta, dove si legge meglio. Linee di misura fini, frecce chiuse, numeri sopra la linea leggibili dal basso o da destra. Mai quotare sugli spigoli nascosti.',f:['Ø diametro · R raggio · □ quadro','Quotatura in serie, in parallelo, a quote sovrapposte']},
{t:'Sezioni',k:['sezion','tratteggio','spaccato'],d:'Si taglia idealmente il pezzo per mostrarne l\'interno. Tratteggio a 45° con linea fine. Non si sezionano per il lungo alberi, viti, nervature, razze.',f:['Tratteggio: 45°, passo costante, linea continua fine']},
{t:'Tolleranze e rugosità',k:['tolleranz','accoppiament','rugosit','gioco','interferenz','iso 286'],d:'Tolleranza dimensionale: di quanto una quota può variare. Foro base H: H7/g6 accoppiamento libero preciso, H7/k6 incerto, H7/p6 forzato. Rugosità Ra in µm.',f:['Tolleranza = Dmax − Dmin','Gioco = Dforo − Dalbero > 0','Ra 0,8 rettifica · Ra 3,2 tornitura fine · Ra 12,5 sgrossatura']},
{t:'Filettature e collegamenti',k:['filett','vite','viti','bulloni','dado','collegament'],d:'Filettatura metrica ISO: M + diametro nominale (M8 = 8 mm, passo grosso 1,25). Nel disegno: diametro esterno linea grossa, fondo filetto linea fine (3/4 di cerchio in vista frontale).',f:['Foro per filettare ≈ D − P','M8×1,25 → punta Ø6,8']},

meccanica:{name:'Meccanica, macchine ed energia',m:['meccanica','macchine','energia'],intro:'Materia d\'indirizzo del secondo e terzo periodo: statica, resistenza dei materiali, organi di macchine, macchine a fluido. Qui fisica e matematica diventano progetto.',
topics:[
{t:'Statica e reazioni vincolari',k:['statica','vincol','reazion','appoggio','incastro','cerniera','trave'],d:'Equazioni cardinali della statica: ΣFx = 0, ΣFy = 0, ΣM = 0. Vincoli: appoggio (1 reazione), cerniera (2), incastro (3).',f:['ΣFx = 0   ΣFy = 0   ΣM = 0']},
{t:'Sollecitazioni semplici',k:['sollecitaz','trazion','compression','taglio','flession','torsion'],d:'Trazione/compressione, taglio, flessione, torsione. Verifica: la tensione di lavoro deve stare sotto l\'ammissibile.',f:['σ = N/A','τ = T/A','σf = Mf / Wf','τt = Mt / Wt','σamm = Re / ν']},
{t:'Moduli di resistenza',k:['modulo di resistenza','inerzia','sezione','wf','momento d\'inerzia'],d:'Dipendono dalla forma della sezione. Una trave alta resiste molto più a flessione di una bassa di pari area.',f:['Rettangolo: Wf = b·h²/6','Cerchio: Wf = π·d³/32   Wt = π·d³/16']},
{t:'Trasmissioni del moto',k:['trasmission','ingranagg','pulegg','cinghi','rapporto','catena','ruote dentate'],d:'Ingranaggi, cinghie, catene. Il rapporto di trasmissione moltiplica la coppia e divide la velocità (o viceversa). La potenza (meno le perdite) si conserva.',f:['i = n₁/n₂ = z₂/z₁ = d₂/d₁','C₂ = C₁·i·η','P = C·ω']},
{t:'Potenza, coppia, giri',k:['coppia','potenz','giri','motore','kw'],d:'Formula d\'officina per legare potenza in kW, coppia in N·m e giri/min.',f:['P [kW] = C [N·m] · n [giri/min] / 9549','C = 9549 · P / n','ω = 2π·n/60']},
{t:'Macchine a fluido',k:['pomp','compressor','turbin','fluido','idraulic','pneumatic','bernoulli'],d:'Pompe, compressori, turbine. Bernoulli: in un condotto l\'energia totale del fluido si conserva (senza perdite).',f:['Portata Q = A·v','Bernoulli: p + ½ρv² + ρgh = cost','Potenza pompa: P = Q·Δp / η']},
{t:'Termodinamica e motori',k:['termodinam','motore','ciclo','otto','diesel','rendimento'],d:'Cicli Otto e Diesel. Il rendimento dipende dal rapporto di compressione. Nessuna macchina termica ha rendimento 1.',f:['η = 1 − Q₂/Q₁','Carnot: ηmax = 1 − T₂/T₁ (in K)']}
],

elettro:{name:'Elettrotecnica ed elettronica',m:['elettr'],intro:'Corrente, tensione, resistenza, circuiti, potenza, poi elettronica di base. Nella meccatronica è la metà del lavoro.',
topics:[
{t:'Grandezze elettriche',k:['corrent','tension','resistenz','carica','ohm'],d:'Tensione (V) = spinta; corrente (A) = flusso di cariche; resistenza (Ω) = opposizione. La legge di Ohm lega tutto.',f:['V = R·I','P = V·I = R·I² = V²/R','Q = I·t']},
{t:'Resistori serie e parallelo',k:['serie','parallel','equivalent','partitore'],d:'Serie: stessa corrente, resistenze si sommano. Parallelo: stessa tensione, si sommano gli inversi. Il parallelo è sempre minore della resistenza più piccola.',f:['Serie: Req = R₁ + R₂ + …','Parallelo: 1/Req = 1/R₁ + 1/R₂','Due in parallelo: R₁R₂/(R₁+R₂)','Partitore: Vout = Vin·R₂/(R₁+R₂)']},
{t:'Leggi di Kirchhoff',k:['kirchhoff','nodi','maglie'],d:'Nodi: correnti entranti = uscenti. Maglie: somma delle tensioni lungo un percorso chiuso = 0.',f:['ΣI = 0 (nodo)','ΣV = 0 (maglia)']},
{t:'Resistività',k:['resistivit','conduttor','cavo','sezione','rame'],d:'La resistenza di un filo cresce con la lunghezza e cala con la sezione. Rame ρ ≈ 0,0175 Ω·mm²/m.',f:['R = ρ·L / S']},
{t:'Condensatori e induttori',k:['condensator','capacit','indutt','bobin','rc'],d:'Condensatore accumula energia nel campo elettrico, induttore nel campo magnetico. Costante di tempo RC: in 5τ si carica quasi del tutto.',f:['Q = C·V','τ = R·C','E = ½CV²']},
{t:'Corrente alternata',k:['alternat','sinusoid','frequenz','efficac','trifase','rms'],d:'Rete italiana 230 V efficaci, 50 Hz. Valore efficace = picco/√2. Trifase 400 V concatenata.',f:['Veff = Vmax/√2','P = V·I·cos φ','Trifase: P = √3·V·I·cos φ']},
{t:'Diodi, LED, transistor',k:['diodo','led','transistor','semicondutt'],d:'Il diodo conduce in un verso solo. Il LED va sempre con resistenza in serie. Il transistor come interruttore comandato.',f:['R_led = (Vcc − Vf) / I_led']}
],

function molarMass(formula){
  const f=formula.replace(/\s/g,'').replace(/[·*•.]/g,'·');
  const parts=f.split('·');let total=0;const comp={};
  for(let part of parts){let mult=1;const m=part.match(/^(\d+)(.*)$/);if(m){mult=+m[1];part=m[2]}
    let i=0;const stack=[{}];
    while(i<part.length){const ch=part[i];
      if(ch==='('||ch==='['){stack.push({});i++}
      else if(ch===')'||ch===']'){i++;let n='';while(i<part.length&&/\d/.test(part[i]))n+=part[i++];const k=+(n||1);const top=stack.pop();if(!stack.length)throw new Error('Parentesi non bilanciate');const cur=stack[stack.length-1];for(const e in top)cur[e]=(cur[e]||0)+top[e]*k}
      else if(/[A-Z]/.test(ch)){let s=ch;i++;while(i<part.length&&/[a-z]/.test(part[i]))s+=part[i++];if(!PT_BY[s])throw new Error('Elemento sconosciuto: '+s);let n='';while(i<part.length&&/\d/.test(part[i]))n+=part[i++];const cur=stack[stack.length-1];cur[s]=(cur[s]||0)+(+(n||1))}
      else throw new Error('Carattere non valido: '+ch)}
    if(stack.length!==1)throw new Error('Parentesi non bilanciate');
    for(const e in stack[0])comp[e]=(comp[e]||0)+stack[0][e]*mult}
  for(const e in comp)total+=PT_BY[e].mass*comp[e];
  if(!Object.keys(comp).length)throw new Error('Formula vuota');
  return{total,comp};
}

function solveFormula(F,vals,unknown){
  const idx=F.v.findIndex(x=>x[0]===unknown);const get=i=>vals[F.v[i][0]];
  if(idx===0){let r=F.K;for(let i=1;i<F.v.length;i++)r*=Math.pow(get(i),F.v[i][3]);return r}
  let den=F.K;for(let i=1;i<F.v.length;i++)if(i!==idx)den*=Math.pow(get(i),F.v[i][3]);
  return Math.pow(get(0)/den,1/F.v[idx][3]);
}

function slotsFor(s){
  const S=st.settings;let sl=S.slots.map((x,i)=>({i,start:x[0],end:x[1]}));
  if(S.reducedUntil&&S.reducedEnd&&s<=S.reducedUntil){const e=toMin(S.reducedEnd);sl=sl.filter(x=>toMin(x.end)<=e)}
  return sl;
}
function lessonsFor(s){
  if(!isWeekday(s))return[];
  const row=st.tt[wdOf(s)]||[],ov=(st.diary[s])||{};
  return slotsFor(s).map(x=>{
    const c=row[x.i]||{},o=ov[x.i]||{};
    const sid=o.sub?(o.sub==='_none'?null:o.sub):c.sub;
    const pid=o.prof?(o.prof==='_none'?null:o.prof):c.prof;
    const sub=subById(sid)||null;
    return{...x,sub,prof:conById(pid)||null,topic:o.topic||'',note:o.note||'',sup:!!(o.sub||o.prof),credit:!!(sub&&sub.credit)};
  });
}
function schedWindow(s){const L=lessonsFor(s);const real=L.filter(l=>l.sub&&!l.credit);if(real.length)return real;if(L.some(l=>l.sub))return[];return L}
function schedMin(s){return schedWindow(s).reduce((a,l)=>a+toMin(l.end)-toMin(l.start),0)}
function attendedMin(s){
  const r=st.att[s];if(!r)return null;if(r.status==='absent')return 0;if(r.status==='fad')return r.fadMin!=null&&r.fadMin!==''?+r.fadMin:schedMin(s);if(r.status!=='present')return null;
  const a=toMin(r.in)??0,b=r.out?toMin(r.out):(s===today()?nowMin():1440);
  return schedWindow(s).reduce((acc,l)=>acc+Math.max(0,Math.min(b,toMin(l.end))-Math.max(a,toMin(l.start))),0);
}
function stats(){
  let sch=0,att=0,days=0,abs=0,fad=0;const reasons={},t=today();
  for(const[d,r]of Object.entries(st.att)){
    if(d>t||r.status==='off')continue;const m=schedMin(d);if(!m)continue;
    const a=attendedMin(d);if(a===null)continue;
    const running=d===t&&r.status==='present'&&!r.out;
    sch+=running?a:m;att+=Math.min(a,m);days++;
    if(r.status==='fad')fad+=Math.min(a,m);
    if(r.status==='absent'){abs++;const k=r.reason||'Altro';reasons[k]=(reasons[k]||0)+1}
  }
  return{sch,att,days,abs,fad,reasons,pct:sch?att/sch*100:100};
}
function missingDays(){
  const out=[],t=today();let d=st.settings.start||t,n=0;
  while(d<t&&n<400){if(isWeekday(d)&&!st.att[d]&&schedMin(d))out.push(d);d=addD(d,1);n++}
  return out;
}
function nextSchoolDay(s){for(let i=0;i<21;i++){if(isWeekday(s)&&!(st.att[s]&&st.att[s].status==='off'))return s;s=addD(s,1)}return s}

function lastTopic(subId,before){
  const ds_=Object.keys(st.diary).filter(d=>d<before).sort().reverse();
  for(const d of ds_){const l=lessonsFor(d).find(l=>l.sub&&l.sub.id===subId&&l.topic);if(l)return{d,topic:l.topic}}
  return null;
}
function recentTopics(n){const out=[],seen=new Set();
  for(const d of Object.keys(st.diary).sort().reverse()){for(const l of lessonsFor(d)){if(l.topic&&l.sub){const k=l.sub.id+'|'+l.topic.toLowerCase();if(!seen.has(k)){seen.add(k);out.push({d,sub:l.sub,topic:l.topic,slot:l.i})}}}if(out.length>=n)break}
  return out.slice(0,n)}
function matsFor(s){
  const L=lessonsFor(s).filter(l=>!l.credit);if(!L.some(l=>l.sub)&&!(st.mat[s]&&(st.mat[s].extra||[]).length))return[];
  const out=[],has=n=>out.some(x=>x.name.toLowerCase()===n.toLowerCase());
  (st.settings.always||[]).forEach(m=>{if(!has(m))out.push({name:m,from:'sempre'})});
  L.forEach(l=>{if(l.sub)(l.sub.materials||[]).forEach(m=>{if(!has(m))out.push({name:m,from:l.sub.name})})});
  const M=st.mat[s]||{};(M.extra||[]).forEach(m=>{if(!has(m))out.push({name:m,from:'extra',extra:true})});
  const ck=M.checked||{};return out.map(x=>({...x,ok:!!ck[x.name]}));
}

  const weeks=Math.floor(daysBetween(monday(S.shiftStart),monday(d))/7);if(weeks<0)return null;
  const id=S.shiftCycle[((weeks%S.shiftCycle.length)+S.shiftCycle.length)%S.shiftCycle.length];
  return id?shiftType(id):null;
}
function shiftConflict(d){
  const sh=shiftFor(d);if(!sh||!sh.start||!sh.end)return null;
  const W=schedWindow(d);if(!W.length)return null;
  const a=toMin(W[0].start),b=toMin(W[W.length-1].end);
  let s=toMin(sh.start),e=toMin(sh.end);if(e<=s)e+=1440;
  const ov=Math.max(0,Math.min(b,e)-Math.max(a,s));

  return{sh,lost:W.filter(l=>Math.min(toMin(l.end),e)-Math.max(toMin(l.start),s)>0),all:ov>=b-a};
}

const GEM_BASE='https://generativelanguage.googleapis.com/v1beta';

async function gemModels(key){

function pickModel(list){
  const ver=id=>{const m=id.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const good=list.filter(m=>/flash/.test(m.id)&&!/lite|preview|exp|thinking|latest/.test(m.id));

function gemErr(status,j){const m=j&&j.error&&j.error.message||'';
  if(status===400&&/API key/i.test(m))return'Chiave Gemini non valida. Controllala in Impostazioni.';
  if(status===403)return'Chiave senza permessi per questo modello o API non abilitata. '+m;
  if(status===429)return'Limite di richieste Gemini raggiunto. Riprova tra qualche minuto (o attiva la fatturazione su AI Studio).';
  if(status===404)return'Modello non trovato: scegline un altro in Impostazioni → Gemini.';
  return'Errore Gemini ('+status+'): '+m}
async function gemini(prompt,{json=false,images=[],sys='',history=[]}={}){
  const S=st.settings;if(!S.gemKey)throw new Error('Configura prima la chiave Gemini in Impostazioni.');
  if(!navigator.onLine)throw new Error('Sei offline: l\'AI ha bisogno di internet.');
  let model=S.gemModel;
  if(!model){const l=await gemModels(S.gemKey);model=pickModel(l);if(!model)throw new Error('Nessun modello Gemini disponibile per questa chiave.');S.gemModel=model;save()}
  const parts=[{text:prompt}];images.forEach(im=>parts.push({inline_data:{mime_type:im.mime,data:im.b64}}));
  const contents=history.filter(m=>m.text).map(m=>({role:m.role==='ai'?'model':'user',parts:[{text:m.text}]}));contents.push({role:'user',parts});
  const body={contents,systemInstruction:{parts:[{text:(sys||'Sei un tutor paziente e preciso. Rispondi in italiano.')+'\nProfilo dello studente: '+(S.aiProfile||AI_PROFILE)}]},generationConfig:{temperature:.6}};
  if(json)body.generationConfig.responseMimeType='application/json';
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);
  let r;try{r=await fetch(GEM_BASE+'/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.gemKey},body:JSON.stringify(body),signal:ctl.signal})}
  catch(e){throw new Error(e.name==='AbortError'?'Gemini non ha risposto in tempo.':'Connessione a Gemini non riuscita.')}finally{clearTimeout(to)}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(gemErr(r.status,j));
  const c=j.candidates&&j.candidates[0];
  const txt=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):'';
  if(!txt)throw new Error(c&&c.finishReason?'Risposta bloccata ('+c.finishReason+').':'Risposta vuota da Gemini.');
  if(json){const s=txt.replace(/^```(?:json)?\s*|\s*```$/g,'');try{return JSON.parse(s)}catch(e){const m=s.match(/[\[{][\s\S]*[\]}]/);if(m)return JSON.parse(m[0]);throw new Error('Gemini ha risposto in un formato non leggibile. Riprova.')}}
  return txt;
}

/* ---- mini markdown ---- */
function md(src){
  const lines=esc(src).split('\n');let out='',inL=null,inCode=false;
  const inline=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const close=()=>{if(inL){out+='</'+inL+'>';inL=null}};
  for(let l of lines){
    if(/^```/.test(l)){close();out+=inCode?'</pre>':'<pre>';inCode=!inCode;continue}
    if(inCode){out+=l+'\n';continue}
    let m;
    if(m=l.match(/^#{1,6}\s+(.*)/)){close();out+='<h4>'+inline(m[1])+'</h4>';continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(inL!=='ul'){close();out+='<ul>';inL='ul'}out+='<li>'+inline(m[1])+'</li>';continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(inL!=='ol'){close();out+='<ol>';inL='ol'}out+='<li>'+inline(m[1])+'</li>';continue}
    close();if(l.trim())out+='<p>'+inline(l)+'</p>';
  }
  close();if(inCode)out+='</pre>';return out;
}

function dictate(id,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(_rec){_rec.stop();return}
  const el=document.getElementById(id);if(!el)return;
  const r=new SR();r.lang='it-IT';r.interimResults=false;r.continuous=true;_rec=r;btn&&btn.classList.add('rec');
  r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t){el.value=(el.value?el.value.replace(/\s*$/,' '):'')+t.trim();el.dispatchEvent(new Event('input'))}};
  r.onerror=e=>{if(e.error==='not-allowed')toast('Permesso microfono negato')};
  r.onend=()=>{_rec=null;btn&&btn.classList.remove('rec')};

function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function shrinkImage(blob,max=1600){
  try{const bmp=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(k>=1&&blob.size<1.5e6)return blob;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||blob),'image/jpeg',.85))}catch(e){return blob}
}

VIEWS.tasks=()=>{
  const t=today(),open=st.tasks.filter(x=>!x.done);
  hdr('Altro','Compiti','+ Nuovo','editTask()',true);
  let h=`<div class="seg">${[['todo','Da fare'],['done','Fatti'],['all','Tutti']].map(([k,l])=>`<button class="${ui.taskF===k?'on':''}" onclick="ui.taskF='${k}';render()">${l}</button>`).join('')}</div>`;
  if(ui.taskF==='todo'){
    const tm=addD(t,1),wk=addD(t,7);
    const G=[['Scaduti',x=>x.due&&x.due<t],['Oggi',x=>x.due===t],['Domani',x=>x.due===tm],['Entro 7 giorni',x=>x.due>tm&&x.due<=wk],['Più avanti',x=>x.due>wk],['Senza scadenza',x=>!x.due]];
    const srt=a=>a.sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
    const out=G.map(([n,f])=>{const L=srt(open.filter(f));return L.length?`<section class="card"><div class="card-h"><h3>${n}</h3><span class="muted">${L.length}</span></div>${L.map(taskRow).join('')}</section>`:''}).join('');
    h+=out||'<section class="card"><p class="empty-s">Nessun compito aperto.</p></section>';
  }else{
    const L=st.tasks.filter(x=>ui.taskF==='all'||x.done).sort((a,b)=>(b.due||'')<(a.due||'')?-1:1);
    h+=`<section class="card">${L.length?L.map(taskRow).join(''):'<p class="empty-s">Niente qui.</p>'}</section>`;
  }
  return h;
};
function editTask(id,preset){
  const x=id?st.tasks.find(t=>t.id===id):Object.assign({title:'',type:'Compito',sub:'',assigned:today(),due:'',desc:'',done:false},preset||{});
  if(!x)return;
  const isTest=x.type==='Verifica'||x.type==='Interrogazione';
  sheet(id?'Modifica compito':'Nuovo compito',
    `<label class="f"><span>Cosa</span><div class="inrow"><input id="t_ti" value="${esc(x.title)}" placeholder="es. Esercizi pag. 42 n. 3–8">${micBtn('t_ti')}</div></label>`+
    `<div class="f2">${fld('Tipo',`<select id="t_ty">${opts(TYPES,x.type)}</select>`)}${fld('Materia',`<select id="t_su">${subOpts(x.sub)}</select>`)}</div>`+

    `<div class="qbtns" style="margin:-4px 0 12px"><button class="btn sm" onclick="quickDue('next')">Prossima lezione della materia</button><button class="btn sm" onclick="quickDue(1)">Domani</button><button class="btn sm" onclick="quickDue(7)">Tra 1 settimana</button></div>`+
    `<label class="f"><span>Dettagli</span><div class="inrow top"><textarea id="t_de" rows="3" placeholder="Pagine, esercizi, indicazioni del prof…">${esc(x.desc)}</textarea>${micBtn('t_de')}</div></label>`+
    `<button class="chk ${x.done?'on':''}" id="t_do" onclick="this.classList.toggle('on')"><i></i><span>Fatto</span></button>`+
    (id&&isTest&&x.due?`<div class="row mt"><button class="btn sm" onclick="makePlan('${id}')">🗓 Crea piano di ripasso</button></div>`:'')+
    (id&&!isTest?'':`<p class="hint">Per verifiche e interrogazioni con data: salva e poi riapri per generare il piano di ripasso automatico.</p>`),
    `${id?`<button class="btn danger left" onclick="delTask('${id}')">Elimina</button>`:''}<button class="btn pri" onclick="saveTask(${id?`'${id}'`:'null'})">Salva</button>`);
}
function quickDue(k){
  const base=val('t_as')||today();let d='';
  if(k==='next'){const s=val('t_su');if(!s){toast('Scegli prima la materia');return}d=nextLessonOf(s,base);if(!d){toast('Materia non presente in orario');return}}
  else d=addD(base,k);
  document.getElementById('t_du').value=d;toast('Scadenza: '+fmtShort(d));
}
function saveTask(id){
  const o={title:val('t_ti'),type:val('t_ty'),sub:val('t_su'),assigned:val('t_as'),due:val('t_du'),desc:val('t_de'),done:$('#t_do').classList.contains('on')};
  if(!o.title){toast('Scrivi cosa c\'è da fare');return}
  let x;if(id){x=st.tasks.find(t=>t.id===id);Object.assign(x,o)}else{x={id:uid(),...o};st.tasks.push(x)}
  save();closeSheet();render();toast('Salvato');
  if(!id&&(o.type==='Verifica'||o.type==='Interrogazione')&&o.due&&daysBetween(today(),o.due)>=2)setTimeout(()=>{if(confirm('Vuoi un piano di ripasso automatico fino al '+fmtShort(o.due)+'?'))makePlan(x.id)},300);
}
function delTask(id){if(!confirm('Eliminare il compito?'))return;st.tasks=st.tasks.filter(t=>t.id!==id&&t.planFor!==id);save();closeSheet();render()}
function makePlan(id){
  const x=st.tasks.find(t=>t.id===id);if(!x||!x.due)return;
  const t=today(),days=[];for(let d=addD(t,t<x.due?0:1);d<x.due;d=addD(d,1)){const cf=shiftConflict(d);const w=wdOf(d);if(w!==0&&!(cf&&cf.all&&w!==6))days.push(d)}
  if(!days.length){toast('Non ci sono giorni utili prima della scadenza');return}
  st.tasks=st.tasks.filter(t=>t.planFor!==id);
  const n=Math.min(5,days.length),s=subById(x.sub),pick=[];
  for(let k=0;k<n;k++)pick.push(days[Math.round(k*(days.length-1)/Math.max(1,n-1))]);
  const labels=['Rileggi appunti e fai lo schema','Esercizi base','Esercizi come in verifica','Ripasso flashcard e formule','Ultimo ripasso a mente, niente di nuovo'];
  [...new Set(pick)].forEach((d,k,arr)=>st.tasks.push({id:uid(),title:`Ripasso ${s?s.name:''} (${k+1}/${arr.length}): ${labels[Math.round(k*(labels.length-1)/Math.max(1,arr.length-1))]}`,type:'Studio',sub:x.sub,assigned:t,due:d,desc:'Piano per: '+x.title,done:false,planFor:id}));
  save();closeSheet();render();toast('Piano di ripasso creato: '+new Set(pick).size+' sessioni');
}

let _urls=[];
VIEWS.files=()=>{
  hdr('Altro','Archivio','','',true);
  return`<section class="card"><div class="card-h"><h3>Carica</h3></div>${fld('Materia (facoltativa)',`<select id="u_s">${subOpts('')}</select>`)}<div class="row"><label class="btn pri grow" style="text-align:center">Scegli file…<input type="file" multiple hidden onchange="uploadFiles(this)"></label><label class="btn grow" style="text-align:center">📷 Foto<input type="file" accept="image/*" capture="environment" hidden onchange="uploadFiles(this)"></label></div><p class="hint">PDF, foto della lavagna, dispense. Restano su questo telefono: per spostarli usa il backup completo.</p></section><section class="card" id="f_list"><p class="empty-s">Caricamento…</p></section>`;
};
VIEWS.files.after=()=>loadFiles();
async function uploadFiles(inp){
  const s=val('u_s'),fs=[...inp.files];let n=0;
  for(let f of fs){if(f.size>40*1024*1024){toast(f.name+' supera 40 MB');continue}
    try{let b=f;if(/^image\//.test(f.type))b=await shrinkImage(f,2400);await fPut({id:uid(),name:f.name||'foto.jpg',type:b.type||f.type||'application/octet-stream',size:b.size,sub:s,date:new Date().toISOString(),data:await b.arrayBuffer()});n++}catch(e){toast('Spazio insufficiente')}}
  inp.value='';if(n)toast(n+' file salvat'+(n>1?'i':'o'));loadFiles();
}
async function loadFiles(){
  const el=$('#f_list');if(!el)return;
  _urls.forEach(u=>URL.revokeObjectURL(u));_urls=[];
  let L=[];try{L=await fAll()}catch(e){el.innerHTML='<p class="empty-s">Archivio non disponibile su questo browser.</p>';return}
  L.sort((a,b)=>a.date<b.date?1:-1);
  const size=L.reduce((a,f)=>a+f.size,0);
  if(!L.length){el.innerHTML='<p class="empty-s">Archivio vuoto.</p>';return}
  el.innerHTML=`<div class="card-h"><h3>File</h3><span class="muted">${L.length} · ${(size/1048576).toFixed(1)} MB</span></div>`+L.map(f=>{
    const u=URL.createObjectURL(new Blob([f.data],{type:f.type}));_urls.push(u);const s=subById(f.sub),img=/image/.test(f.type);
    const ic=/pdf/.test(f.type)?'📄':img?`<img src="${u}" class="avimg">`:/word|document/.test(f.type)?'📝':/sheet|excel/.test(f.type)?'📊':'📎';
    return`<div class="li"><span class="av">${ic}</span><div class="grow"><b style="word-break:break-all">${esc(f.name)}</b><small>${s?esc(s.name)+' · ':''}${(f.size/1024).toFixed(0)} KB · ${fmtShort(f.date.slice(0,10))}${f.lesson?' · lezione':''}</small></div>${img?`<button class="ib" onclick="viewPhoto('${f.id}')">✦</button>`:''}<a class="ib" href="${u}" target="_blank" rel="noopener">👁</a><a class="ib" href="${u}" download="${esc(f.name)}">⬇</a><button class="ib" onclick="delFile('${f.id}')">✕</button></div>`}).join('');
}
async function delFile(id){if(!confirm('Eliminare il file?'))return;await fDel(id);loadFiles()}
async function viewPhoto(id){
  const f=await fGet(id);if(!f)return;const u=URL.createObjectURL(new Blob([f.data],{type:f.type}));
  sheet(f.name,`<img src="${u}" class="bigimg"><div class="row mt"><button class="btn pri" onclick="photoAI('${id}','explain')">✦ Trascrivi e spiega (Gemini)</button><button class="btn" onclick="photoAI('${id}','cards')">✦ Crea flashcard</button></div><div id="ph_out" class="aiout"></div>`,
  `<a class="btn" href="${u}" download="${esc(f.name)}">Scarica</a>`);
}

function gcalLink(n){const d=(n.date||today()).replace(/-/g,'');let dates;
  if(n.time){const[h,m]=n.time.split(':').map(Number);const e=h*60+m+60;dates=`${d}T${pad(h)}${pad(m)}00/${d}T${pad(Math.floor(e/60)%24)}${pad(e%60)}00`}else dates=`${d}/${addD(n.date||today(),1).replace(/-/g,'')}`;
  return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(n.title||'')+'&dates='+dates+'&ctz=Europe/Rome&details='+encodeURIComponent(n.body||'')+'&location='+encodeURIComponent(n.place||'')}
function noteRow(n){
  const t=today(),past=n.type==='appt'&&n.date&&n.date<t;
  return`<div class="li" onclick="editNote('${n.id}')" style="cursor:pointer;${past?'opacity:.5':''}"><span class="av">${n.type==='appt'?'📅':'🗒️'}</span><div class="grow"><b>${esc(n.title||'Senza titolo')}</b><small>${n.type==='appt'&&n.date?(n.date===t?'Oggi':fmtShort(n.date))+(n.time?' · '+esc(n.time):'')+(n.place?' · '+esc(n.place):''):esc((n.body||'').slice(0,80))}</small></div></div>`;
}

  const t=today();let L=st.notes.filter(n=>n.type===ui.noteF);
  if(ui.noteF==='appt'){const k=n=>(n.date||'')+(n.time||'');const up=L.filter(n=>!n.date||n.date>=t).sort((a,b)=>k(a)<k(b)?-1:1),pa=L.filter(n=>n.date&&n.date<t).sort((a,b)=>k(a)<k(b)?1:-1);L=up.concat(pa)}
  else L.sort((a,b)=>(a.upd||'')<(b.upd||'')?1:-1);
  h+=`<section class="card">${L.length?L.map(noteRow).join(''):`<p class="empty-s">${ui.noteF==='appt'?'Nessun appuntamento. Visite, colloqui, impegni fuori scuola: mettili qui e compaiono in Oggi e nel Diario.':'Nessuna nota.'}</p>`}</section>`;

async function wikiLoad(T){
  const el=$('#wk_out');if(!el)return;
  if(!navigator.onLine){el.innerHTML='<p class="empty-s">Sei offline.</p>';return}
  try{
    const u='https://it.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(T)+'&gsrlimit=4&prop=extracts|pageimages|info&exintro=1&explaintext=1&exsentences=5&exlimit=4&piprop=thumbnail&pithumbsize=320&inprop=url';
    const j=await(await fetch(u)).json();const P=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
    if(!$('#wk_out'))return;
    if(!P.length){el.innerHTML='<p class="empty-s">Nessuna voce trovata.</p>';return}
    const a=P[0];
    el.innerHTML=`<div class="wk">${a.thumbnail?`<img src="${a.thumbnail.source}" alt="">`:''}<div><b>${esc(a.title)}</b><p>${esc(a.extract||'')}</p><a href="${a.fullurl}" target="_blank" rel="noopener">Leggi tutta la voce ↗</a></div></div>${P.length>1?`<div class="sub-h">Voci correlate</div><div class="chips">${P.slice(1).map(x=>`<a class="chip" href="${x.fullurl}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join('')}</div>`:''}`;
  }catch(e){if($('#wk_out'))el.innerHTML='<p class="empty-s">Wikipedia non raggiungibile.</p>'}
}
function topicPrompt(mode){

  const last=[];for(const d of Object.keys(st.diary).sort().reverse())for(const l of lessonsFor(d))if(l.topic&&l.topic.toLowerCase()===String(T).toLowerCase()&&l.note)last.push(l.note);
  const notes=last.length?'\nI miei appunti della lezione: '+last[0].slice(0,500):'';
  const base=`Materia: ${sn||'—'}. Argomento della lezione: "${T}".${notes}\n`;
  if(mode==='explain')return base+'Spiegamelo da zero, in modo chiaro e concreto: concetti chiave, formule con unità di misura (se ci sono), un esempio pratico preso dall\'officina o dalla vita reale, errori tipici da evitare. Chiudi con 3 domande per verificare se ho capito.';

}

  const c=rv.q[0],s=subById(c.sub),pv=k=>{const x=schedule({...c},k);return x.ivl?x.ivl+' g':'ora'};
  return`<p class="muted" style="text-align:center">${rv.q.length} rimast${rv.q.length>1?'e':'a'}${s?' · '+esc(s.name):''}</p>
  <section class="card fc" onclick="rv.show=true;render()"><div class="fcf">${esc(c.front)}</div>${rv.show?`<hr><div class="fcb">${esc(c.back)}</div>`:'<p class="hint" style="text-align:center">Pensa alla risposta, poi tocca per girare</p>'}</section>
  ${rv.show?`<div class="rate"><button class="btn danger" onclick="rateCard(0)">Ancora<small>${pv(0)}</small></button><button class="btn" onclick="rateCard(1)">Difficile<small>${pv(1)}</small></button><button class="btn" onclick="rateCard(2)">Bene<small>${pv(2)}</small></button><button class="btn pri" onclick="rateCard(3)">Facile<small>${pv(3)}</small></button></div>`:''}`;
};
function schedule(c,q){
  if(q===0){c.reps=0;c.lapses=(c.lapses||0)+1;c.ef=Math.max(1.3,c.ef-.2);c.ivl=0}
  else if(q===1){c.ivl=c.reps===0?1:Math.max(1,Math.round(c.ivl*1.2));c.ef=Math.max(1.3,c.ef-.15);c.reps++}
  else if(q===2){c.ivl=c.reps===0?1:c.reps===1?3:Math.round(c.ivl*c.ef);c.reps++}
  else{c.ivl=c.reps===0?3:Math.round(Math.max(c.ivl,1)*c.ef*1.3);c.ef+=.15;c.reps++}
  c.due=addD(today(),c.ivl);return c;
}
function rateCard(q){const c=rv.q.shift();const real=st.cards.find(x=>x.id===c.id);if(real)schedule(real,q);if(q===0)rv.q.push(real||c);else rv.done++;rv.show=false;save();render();vibrate(15)}

function fmtLeft(R){const s=Math.max(0,Math.round((R.endsAt-Date.now())/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function pomoStart(){const S=st.settings,sid=$('#pm_s')?val('pm_s'):(st.pomoRun&&st.pomoRun.sub)||'';st.pomoRun={mode:'work',sub:sid,started:Date.now(),min:+S.pomoWork||25,endsAt:Date.now()+(+S.pomoWork||25)*60000};save();askNotifyOnce();render()}
function pomoStop(){const R=st.pomoRun;if(R&&R.mode==='work'){const m=Math.floor((Date.now()-R.started)/60000);if(m>=5){st.pomos.push({date:today(),sub:R.sub,min:m});toast('Registrati '+m+' minuti')}}st.pomoRun=null;save();render()}
function pomoTick(){
  const R=st.pomoRun;if(!R)return;

    if(R.mode==='work'){st.pomos.push({date:today(),sub:R.sub,min:R.min});const b=+st.settings.pomoBreak||5;st.pomoRun={mode:'break',sub:R.sub,started:Date.now(),min:b,endsAt:Date.now()+b*60000};notify('Sessione completata','Pausa di '+b+' minuti. Alzati e muoviti.');}
    else{st.pomoRun=null;notify('Pausa finita','Pronto per un\'altra sessione?')}

function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.35].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch(e){}}

  const lb=st.settings.lastBackup;if((!lb||daysBetween(lb,t)>=7)&&(st.tasks.length+Object.keys(st.att).length+st.cards.length)>5)T.push({i:'💾',t:lb?`Ultimo backup ${daysBetween(lb,t)} giorni fa. Salvalo su Drive in un tocco.`:'Non hai ancora fatto un backup. Un tocco e lo mandi su Drive.',a:'exportData(true)'});
  T.push({i:'✦',t:GEN[k%GEN.length]});
  return T;
}

function parseGrade(s){s=String(s).trim().replace(',','.');let m=s.match(/^(\d+(?:\.\d+)?)\s*([+\-½]|-\/\+|\/)?$/);if(!m)return NaN;let v=+m[1];if(m[2]==='+')v+=.25;else if(m[2]==='-')v-=.25;else if(m[2]==='½')v+=.5;return v}

  const by={};st.grades.forEach(g=>{(by[g.sub]=by[g.sub]||[]).push(g)});
  const avgs=Object.entries(by).map(([s,L])=>[s,gradeAvg(L)]).filter(x=>!isNaN(x[1]));
  const tot=avgs.length?avgs.reduce((a,x)=>a+x[1],0)/avgs.length:NaN;
  let h=`<section class="card"><div class="stat"><div class="big" style="color:${gcol(tot)}">${isNaN(tot)?'—':tot.toFixed(2).replace('.',',')}</div><div><b>Media generale</b><small>media delle medie di ${avgs.length} materi${avgs.length>1?'e':'a'}</small></div></div>${avgs.filter(x=>x[1]<6).length?`<p class="warn">Insufficienze: ${avgs.filter(x=>x[1]<6).map(x=>esc((subById(x[0])||{}).name||'?')).join(', ')}. Serve almeno 6 in tutte per passare al periodo successivo.</p>`:''}</section>`;
  h+=Object.entries(by).map(([sid,L])=>{const s=subById(sid),a=gradeAvg(L);L.sort((x,y)=>x.date<y.date?-1:1);
    return`<section class="card"><div class="card-h"><h3 class="dayname">${s?`<span class="dot" style="background:${s.color}"></span> `:''}${esc(s?s.name:'Senza materia')}</h3><b style="color:${gcol(a)}">${a.toFixed(2).replace('.',',')}</b></div><div class="grades">${L.map(g=>`<button class="gr" style="border-color:${gcol(g.v)}" onclick="editGrade('${g.id}')"><b>${String(g.v).replace('.',',')}</b><small>${fmtShort(g.date).slice(4)}</small><small>${esc(g.type.slice(0,5))}${(+g.w||1)!==1?' ×'+g.w:''}</small></button>`).join('')}</div><button class="btn sm mt" onclick="whatIf('${sid}')">🎯 Quanto mi serve?</button></section>`}).join('');
  return h;
};
function editGrade(id){const g=id?st.grades.find(x=>x.id===id):{sub:'',date:today(),v:'',type:'Scritto',w:1,note:''};if(!g)return;
  sheet(id?'Modifica voto':'Nuovo voto',fld('Materia',`<select id="g_s">${subOpts(g.sub)}</select>`)+`<div class="f2">${fld('Voto (es. 6,5 · 7+ · 5-)',`<input id="g_v" inputmode="decimal" value="${esc(g.v)}">`)}${fld('Data',`<input type="date" id="g_d" value="${esc(g.date)}">`)}</div><div class="f2">${fld('Tipo',`<select id="g_t">${opts(['Scritto','Orale','Pratico','Grafico'],g.type)}</select>`)}${fld('Peso',`<select id="g_w">${[['0.5','×0,5'],['1','×1'],['1.5','×1,5'],['2','×2']].map(o=>`<option value="${o[0]}" ${+g.w===+o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)}</div>`+fld('Nota',`<input id="g_n" value="${esc(g.note)}" placeholder="argomento, commento del prof">`),
  `${id?`<button class="btn danger left" onclick="st.grades=st.grades.filter(x=>x.id!=='${id}');save();closeSheet();render()">Elimina</button>`:''}<button class="btn pri" onclick="saveGrade(${id?`'${id}'`:'null'})">Salva</button>`)}
function saveGrade(id){const v=parseGrade(val('g_v'));if(isNaN(v)||v<1||v>10){toast('Voto tra 1 e 10');return}const o={sub:val('g_s'),v,date:val('g_d')||today(),type:val('g_t'),w:+val('g_w')||1,note:val('g_n')};if(!o.sub){toast('Scegli la materia');return}

function abToB64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64ToAb(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
async function exportData(withFiles){
  const safe=JSON.parse(JSON.stringify(st));safe.settings.gemKey='';
  const o={app:'diario-serale',ver:APP_VER,exported:new Date().toISOString(),data:safe};
  if(withFiles){try{o.files=(await fAll()).map(f=>({...f,data:abToB64(f.data)}))}catch(e){}}
  const name=`diario-serale-${today()}${withFiles?'-completo':''}.json`;
  const blob=new Blob([JSON.stringify(o)],{type:'application/json'});
  const done=()=>{st.settings.lastBackup=today();save();if(ui.view==='settings'||ui.view==='more'||ui.view==='today')render()};
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Diario Serale',text:'Backup del '+fmtDate(today())});done();toast('Backup condiviso');return}}
  catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);done();toast('Backup scaricato');
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const o=JSON.parse(r.result);if(!o.data||!o.data.v)throw 0;
    if(!confirm('Sostituire i dati attuali con il backup del '+String(o.exported||'').slice(0,10)+'?'))return;
    const key=st.settings.gemKey,model=st.settings.gemModel;st=migrate(o.data);if(!st.settings.gemKey){st.settings.gemKey=key;st.settings.gemModel=model}save();
    if(o.files)for(const x of o.files)await fPut({...x,data:b64ToAb(x.data)});
    render();toast('Backup ripristinato')}catch(e){toast('File di backup non valido')}inp.value=''};
  r.readAsText(f);
}

  if(!n){toast('Niente da esportare: compila prima l\'orario');return}
  const blob=new Blob([L.join('\r\n')],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='scuola-serale.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
  toast(n+' eventi esportati: apri il file con Calendario');
}

/* ============ STAMPA PRESENZE ============ */
function printAtt(){
  const S=stats(),se=st.settings,days=Object.keys(st.att).sort();
  $('#print').innerHTML=`<h1>Registro presenze</h1><p>${esc(se.name||'')} · ${esc(se.school)} · ${esc(se.course)}<br>Periodo: ${days.length?fmtDate(days[0])+' – '+fmtDate(days[days.length-1]):'—'} · Stampato il ${fmtDate(today())}</p>
  <p><b>Frequenza ${S.sch?S.pct.toFixed(1).replace('.',','):'—'}%</b> · ${dur(S.att)} su ${dur(S.sch)} · Assenze: ${S.abs} giorni${S.fad?' · FAD: '+dur(S.fad):''}${se.monte?' · Monte ore PFI: '+se.monte+' h':''}</p>
  <table><thead><tr><th>Data</th><th>Stato</th><th>Orario</th><th>Ore</th><th>Motivo / nota</th></tr></thead><tbody>${days.map(d=>{const r=st.att[d],a=attendedMin(d);return`<tr><td>${fmtDate(d)} ${WD[wdOf(d)]}</td><td>${{present:'Presente',absent:'Assente',fad:'FAD',off:'No lezione'}[r.status]||''}</td><td>${r.status==='present'?esc((r.in||'')+'–'+(r.out||'')):''}</td><td>${r.status==='off'?'':dur(a)+' / '+dur(schedMin(d))}</td><td>${esc([r.reason&&r.status==='absent'?r.reason:'',r.note].filter(Boolean).join(' · '))}</td></tr>`}).join('')}</tbody></table>`;
  document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('printing'),500)},100);
}

/* ============ AVVIO ============ */
async function boot(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if(!localStorage.getItem(KEY)){const s=await kvGet('state');if(s){st=migrate(JSON.parse(s));save();toast('Dati recuperati dalla copia di sicurezza')}}}catch(e){}
  pruneSnaps();render();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
setInterval(pomoTick,1000);
setInterval(()=>{notifCheck();if(ui.view==='today'&&!sheetOpen()&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pomoTick();notifCheck();if(!sheetOpen()&&ui.view==='today')render()}});
window.addEventListener('online',()=>{if(ui.view==='topic')render()});
window.addEventListener('error',e=>{console.error(e.error||e.message)});

</script>
